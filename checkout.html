<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Afrishop</title>
<meta name="description" content="Secure checkout with M-Pesa, PayPal and card payment options.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Checkout — Afrishop">
<meta property="og:description" content="Secure checkout with M-Pesa, PayPal and card payment options.">
<meta property="og:site_name" content="Afrishop">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="/css/styles.css">
<style>
  .checkout-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:32px; align-items:start; }
  @media (max-width:900px){ .checkout-grid{ grid-template-columns:1fr; } }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .field-row{ grid-template-columns:1fr; } }
  .pay-opt{ display:flex; align-items:center; gap:12px; padding:14px; border:1.5px solid var(--line); border-radius:11px; cursor:pointer; margin-bottom:10px; }
  .pay-opt.active{ border-color:var(--indigo-950); background:var(--cream-dim); }
  .pay-opt .radio{ width:18px; height:18px; border-radius:50%; border:2px solid var(--ink-faint); flex-shrink:0; }
  .pay-opt.active .radio{ border-color:var(--indigo-950); background:radial-gradient(circle,var(--indigo-950) 40%, transparent 44%); }
  .pay-opt.disabled{ opacity:0.45; cursor:not-allowed; }
  .summary-card{ background:var(--indigo-950); color:#fff; border-radius:var(--radius-l); padding:24px; position:sticky; top:90px; }
  .sum-row{ display:flex; justify-content:space-between; font-size:13px; color:rgba(255,255,255,0.65); margin-top:10px; }
  .sum-row.total{ font-size:17px; font-weight:700; color:#fff; margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.15); }
  #mpesaStatus{ display:none; text-align:center; padding:16px; }
  #mpesaStatus .spinner{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--marigold); border-radius:50%; margin:0 auto 12px; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<header class="site"><div class="wrap"><nav>
  <a href="/" class="store-logo"><span class="mark"></span>Afrishop</a>
  <div class="nav-links"></div>
  <div class="nav-right"><span style="font-size:12.5px;color:var(--ink-soft);">🔒 Secure checkout</span></div>
</nav></div></header>

<section class="wrap" id="content"><div class="skeleton" style="height:300px;"></div></section>
<footer class="site">© 2026 Afrishop.</footer>
<script src="/js/api.js"></script>
<script>
  let cartData = null, paymentMethod = 'mpesa', config = { paypal_enabled: false, mpesa_enabled: false };

  async function init() {
    const content = document.getElementById('content');
    try {
      const { user } = await API.get('/auth/me');
      if (!user) { content.innerHTML = `<div class="empty-state"><div class="ic">🔒</div><h3>Log in to check out</h3><a href="/account" class="btn btn-primary">Log in</a></div>`; return; }
      cartData = await API.get('/cart');
      if (cartData.items.length === 0) { content.innerHTML = `<div class="empty-state"><div class="ic">🛒</div><h3>Your cart is empty</h3><a href="/" class="btn btn-primary">Start shopping</a></div>`; return; }
      config = await API.get('/config').catch(() => config);

      const deliveryFee = 300;
      content.innerHTML = `
        <div id="errorSlot"></div>
        <div class="checkout-grid">
          <div>
            <div class="card" style="margin-bottom:16px;">
              <h3 style="font-size:16px;margin-bottom:16px;">Delivery details</h3>
              <div class="field"><label>Full name</label><input id="f_name" value="${user.full_name}"></div>
              <div class="field"><label>Phone number</label><input id="f_phone" placeholder="07XXXXXXXX" value="${user.phone || ''}"></div>
              <div class="field-row">
                <div class="field"><label>County</label><input id="f_county" placeholder="Nairobi"></div>
                <div class="field"><label>Town</label><input id="f_town" placeholder="Westlands"></div>
              </div>
              <div class="field"><label>Street address</label><input id="f_street" placeholder="e.g. 4th Avenue, Apt 12"></div>
            </div>
            <div class="card" id="paymentCard">
              <h3 style="font-size:16px;margin-bottom:16px;">Payment method</h3>
              <div class="pay-opt active" data-method="mpesa" onclick="selectPay(this)">
                <div class="radio"></div>
                <div><div style="font-weight:600;font-size:13.5px;">M-Pesa</div><div style="font-size:11.5px;color:var(--ink-faint);">${config.mpesa_enabled ? 'Pay via STK push to your phone' : 'Not yet configured on this deployment'}</div></div>
              </div>
              <div class="pay-opt ${config.paypal_enabled ? '' : 'disabled'}" data-method="paypal" onclick="${config.paypal_enabled ? 'selectPay(this)' : ''}">
                <div class="radio"></div>
                <div><div style="font-weight:600;font-size:13.5px;">PayPal</div><div style="font-size:11.5px;color:var(--ink-faint);">${config.paypal_enabled ? 'Charged in USD — converted from KES' : 'Not yet configured on this deployment'}</div></div>
              </div>
              <div class="pay-opt" data-method="card" onclick="selectPay(this)">
                <div class="radio"></div>
                <div><div style="font-weight:600;font-size:13.5px;">Card payment</div><div style="font-size:11.5px;color:var(--ink-faint);">Visa, Mastercard via Paystack</div></div>
              </div>

              <div id="mpesaStatus"><div class="spinner"></div><div id="mpesaStatusText" style="font-size:13.5px;color:var(--ink-soft);"></div></div>
            </div>
          </div>
          <div class="summary-card">
            <h3 style="font-size:16px;">Order summary</h3>
            ${cartData.items.map(i => `<div class="sum-row"><span>${i.name} × ${i.quantity}</span><span>${fmtKES((i.sale_price_kes||i.price_kes)*i.quantity)}</span></div>`).join('')}
            <div class="sum-row"><span>Subtotal</span><span>${fmtKES(cartData.subtotal)}</span></div>
            <div class="sum-row"><span>Delivery</span><span>${fmtKES(deliveryFee)}</span></div>
            <div class="sum-row total"><span>Total</span><span>${fmtKES(cartData.subtotal + deliveryFee)}</span></div>
            <button class="btn btn-marigold btn-block" style="margin-top:18px;" id="placeBtn" onclick="placeOrder()">Place order</button>
          </div>
        </div>`;
    } catch (e) {
      content.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div><h3>Couldn't load checkout</h3><p>${e.message}</p></div>`;
    }
  }

  function selectPay(el) {
    document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    paymentMethod = el.dataset.method;
  }

  async function placeOrder() {
    const errorSlot = document.getElementById('errorSlot');
    errorSlot.innerHTML = '';
    const phone = document.getElementById('f_phone').value.trim();
    const body = {
      recipient_name: document.getElementById('f_name').value.trim(),
      phone,
      county: document.getElementById('f_county').value.trim(),
      town: document.getElementById('f_town').value.trim(),
      street: document.getElementById('f_street').value.trim(),
      payment_provider: paymentMethod,
    };
    const btn = document.getElementById('placeBtn');
    btn.disabled = true; btn.textContent = 'Placing order...';
    try {
      const result = await API.post('/orders', body);
      const order = result.orders[0];

      if (paymentMethod === 'mpesa') {
        await payWithMpesa(order, phone);
      } else if (paymentMethod === 'paypal') {
        await payWithPaypal(order);
      } else {
        // Card (Paystack) integration point — order stays 'pending' until a
        // real Paystack checkout + webhook confirms it (see README).
        location.href = '/order-confirmation?order=' + order.order_number;
      }
    } catch (e) {
      errorSlot.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      btn.disabled = false; btn.textContent = 'Place order';
    }
  }

  async function payWithMpesa(order, phone) {
    const btn = document.getElementById('placeBtn');
    const statusBox = document.getElementById('mpesaStatus');
    const statusText = document.getElementById('mpesaStatusText');
    const errorSlot = document.getElementById('errorSlot');
    try {
      const push = await API.post('/payments/mpesa/stk-push', { order_id: order.id, phone });
      document.getElementById('paymentCard').style.display = 'none';
      statusBox.style.display = 'block';
      statusText.textContent = push.message || 'Check your phone and enter your M-Pesa PIN to complete payment.';
      pollMpesaStatus(push.checkoutRequestId, order.order_number, statusText);
    } catch (e) {
      errorSlot.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      btn.disabled = false; btn.textContent = 'Place order';
    }
  }

  function pollMpesaStatus(checkoutRequestId, orderNumber, statusText) {
    let elapsed = 0;
    const interval = setInterval(async () => {
      elapsed += 4000;
      try {
        const status = await API.get('/payments/mpesa/status/' + checkoutRequestId);
        if (status.completed) {
          clearInterval(interval);
          location.href = '/order-confirmation?order=' + orderNumber;
        } else if (status.failed) {
          clearInterval(interval);
          statusText.textContent = status.message || 'Payment failed. Please try again.';
          document.querySelector('.spinner').style.display = 'none';
        }
      } catch (e) { /* keep polling — a single failed poll isn't fatal */ }
      if (elapsed >= 90_000) {
        clearInterval(interval);
        statusText.textContent = 'Still waiting for confirmation — this can take a minute. Check your order status under "My Orders".';
      }
    }, 4000);
  }

  async function payWithPaypal(order) {
    const btn = document.getElementById('placeBtn');
    const errorSlot = document.getElementById('errorSlot');
    try {
      const { approvalUrl } = await API.post('/payments/paypal/create-order', { order_id: order.id });
      sessionStorage.setItem('afrishop_pending_order', order.order_number);
      location.href = approvalUrl; // redirect to PayPal-hosted checkout; returns to PAYPAL_RETURN_URL
    } catch (e) {
      errorSlot.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      btn.disabled = false; btn.textContent = 'Place order';
    }
  }
  init();
</script>
</body>
</html>
