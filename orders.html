<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Afrishop</title>
<meta name="description" content="Track your Afrishop order history and delivery status.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="My Orders — Afrishop">
<meta property="og:description" content="Track your Afrishop order history and delivery status.">
<meta property="og:site_name" content="Afrishop">
<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="/css/styles.css">
<style>
  .order-card{ padding:18px 20px; margin-bottom:12px; }
  .order-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .order-top .num{ font-size:14px; font-weight:600; }
  .order-meta{ font-size:12.5px; color:var(--ink-faint); }
  .track-row{ display:flex; gap:4px; margin-top:14px; }
  .track-step{ flex:1; text-align:center; }
  .track-dot{ width:10px; height:10px; border-radius:50%; background:var(--line); margin:0 auto 5px; }
  .track-step.done .track-dot{ background:var(--leaf); }
  .track-step span{ font-size:10px; color:var(--ink-faint); }
  .track-line{ height:2px; background:var(--line); flex:4; align-self:center; margin-top:-16px; }
</style>
</head>
<body>
<header class="site"><div class="wrap"><nav>
  <a href="/" class="store-logo"><span class="mark"></span>Afrishop</a>
  <div class="nav-links"><a href="/">Shop</a><a href="/orders">My orders</a></div>
  <div class="nav-right" id="authNavSlot"></div>
  <a href="/cart" class="icon-btn">🛒<span class="cart-count" id="cartCount" style="display:none;">0</span></a>
</nav></div></header>

<section class="wrap">
  <h1 style="font-size:24px;margin-bottom:22px;">My orders</h1>
  <div id="content"><div class="skeleton" style="height:120px;margin-bottom:12px;"></div></div>
</section>
<footer class="site">© 2026 Afrishop.</footer>
<script src="/js/api.js"></script>
<script>
  renderAuthNav(); refreshCartCount();
  const STAGES = ['pending','paid','processing','shipped','delivered'];

  async function load() {
    const content = document.getElementById('content');
    try {
      const { user } = await API.get('/auth/me');
      if (!user) { content.innerHTML = `<div class="empty-state"><div class="ic">🔒</div><h3>Log in to see your orders</h3><a href="/account" class="btn btn-primary">Log in</a></div>`; return; }
      const orders = await API.get('/orders');
      if (orders.length === 0) { content.innerHTML = `<div class="empty-state"><div class="ic">🧾</div><h3>No orders yet</h3><p>Your order history will show up here.</p><a href="/" class="btn btn-primary">Start shopping</a></div>`; return; }
      content.innerHTML = orders.map(o => {
        const idx = STAGES.indexOf(o.status);
        const cancelled = ['cancelled','refunded'].includes(o.status);
        return `<div class="card order-card">
          <div class="order-top">
            <span class="num mono">#${o.order_number}</span>
            <span class="badge ${o.status}">${o.status}</span>
          </div>
          <div class="order-meta">${o.store_name} · ${fmtKES(o.total_kes)} · ${new Date(o.created_at).toLocaleDateString()}</div>
          ${!cancelled ? `<div class="track-row">
            ${STAGES.map((s,i) => `<div class="track-step ${i<=idx?'done':''}"><div class="track-dot"></div><span>${s}</span></div>${i<STAGES.length-1?'<div class="track-line"></div>':''}`).join('')}
          </div>` : ''}
        </div>`;
      }).join('');
    } catch (e) {
      content.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div><h3>Couldn't load orders</h3><p>${e.message}</p></div>`;
    }
  }
  load();
</script>
</body>
</html>
